services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fieldops_pro
      POSTGRES_USER: fieldops
      POSTGRES_PASSWORD: fieldops_local_only
    ports: ["5432:5432"]
    volumes: ["fieldops_pg:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U fieldops"], interval: 5s, timeout: 3s, retries: 10}
volumes: {fieldops_pg: {}}
